name: Daily Wrap

# GitHub cron is UTC and Sydney observes DST, so 08:47 local is a moving
# target: 21:47 UTC under AEDT, 22:47 UTC under AEST. Both are registered,
# plus an hour-later third as a spare. Day-of-week 0-4 is Sun-Thu in UTC,
# which is Mon-Fri in Sydney at these hours.
#
# The gate deliberately does NOT work out which cron "should" own today.
# An earlier version did, by matching each cron to the UTC offset it was
# written for, and it lost two consecutive days: GitHub delivered the 21:47
# firing 54 minutes late (08:41 Sydney — a perfectly good time to publish)
# and the gate threw it away for carrying the wrong offset, while the 22:47
# firing that was supposed to cover AEST never arrived at all. Scheduled
# workflows are best-effort; assuming they fire near their nominal time is
# the bug.
#
# So the gate asks two questions instead, neither of which cares which cron
# woke it:
#
#   1. Is it a sensible hour in Sydney right now?
#   2. Has today's episode not already been published?
#
# Whichever firing lands first inside the window does the work; later ones
# find the release present and stand down. A late run gets used rather than
# discarded, and a dropped one costs nothing so long as a sibling arrives.
on:
  schedule:
    - cron: '47 21 * * 0-4'   # 08:47 Sydney under AEDT / 07:47 under AEST
    - cron: '47 22 * * 0-4'   # 09:47 Sydney under AEDT / 08:47 under AEST
    - cron: '47 23 * * 0-4'   # spare, an hour behind whichever of those is live
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release and update the feed'
        type: boolean
        default: true

permissions:
  contents: write   # create releases
  pages: write      # deploy the feed
  id-token: write   # required by deploy-pages

concurrency:
  group: daily-wrap
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      date: ${{ steps.check.outputs.date }}
      pretty: ${{ steps.check.outputs.pretty }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Australia/Sydney date +%F)
          echo "date=$DATE"                                          >> "$GITHUB_OUTPUT"
          echo "pretty=$(TZ=Australia/Sydney date '+%A %-d %B %Y')"  >> "$GITHUB_OUTPUT"
          echo "Sydney is currently $(TZ=Australia/Sydney date) (triggered by '${SCHEDULE:-manual}')"

          if [ -z "${SCHEDULE:-}" ]; then
            echo "Manual run — proceeding regardless of hour."
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Publish window in Sydney local time. 08:47 remains the intended
          # delivery; the width is tolerance for GitHub's scheduling drift,
          # measured at ~54 minutes. Widen it to miss fewer days, narrow it
          # to bias towards punctuality at the cost of missing more.
          OPEN=510    # 08:30
          CLOSE=660   # 11:00

          # 10# forces base 10 — date zero-pads, and bash reads 08 and 09 as
          # invalid octal.
          H=$(TZ=Australia/Sydney date +%H)
          M=$(TZ=Australia/Sydney date +%M)
          NOW=$(( 10#$H * 60 + 10#$M ))

          if [ "$NOW" -lt "$OPEN" ] || [ "$NOW" -gt "$CLOSE" ]; then
            echo "Sydney local time is outside the 08:30-11:00 publish window; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Whichever firing gets here first builds the episode; the others
          # find it already published and stand down. This is what makes a
          # late or duplicated cron harmless.
          if gh release view "ep-$DATE" >/dev/null 2>&1; then
            echo "ep-$DATE is already published; nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for $DATE yet and we are inside the window; proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # A token pasted through a terminal can pick up a CR, a wrapped line break
      # or trailing space. Those are illegal in an HTTP header, and the only
      # symptom is an opaque "Authorization has invalid value" raised two
      # minutes in, after npm and 21 feed fetches have already run. Check it
      # here instead, in five seconds, before anything expensive.
      - name: Validate credentials
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ]; then
            NAME=CLAUDE_CODE_OAUTH_TOKEN; VAL=$TOKEN; WANT=sk-ant-oat01-
          elif [ -n "${APIKEY:-}" ]; then
            NAME=ANTHROPIC_API_KEY; VAL=$APIKEY; WANT=sk-ant-
          else
            echo "::error::Set either CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repo secret."
            exit 1
          fi

          CLEAN=$(printf '%s' "$VAL" | tr -d '[:space:]')
          if [ "${#CLEAN}" -ne "${#VAL}" ]; then
            echo "::warning::$NAME had whitespace in it (${#VAL} chars, ${#CLEAN} without); stripping it. Worth re-pasting the secret cleanly."
          fi

          case "$CLEAN" in
            "$WANT"*) ;;
            *) echo "::error::$NAME does not begin with '$WANT' — the wrong value was copied into the secret. Re-run 'claude setup-token' and set it again."
               exit 1 ;;
          esac

          # The prefix alone is not enough. A token that wraps in the terminal
          # gets truncated at the line break, and the surviving fragment still
          # starts with the right prefix -- that is exactly how a 14-character
          # secret passed an earlier version of this check.
          if [ "${#CLEAN}" -lt 60 ]; then
            echo "::error::$NAME is only ${#CLEAN} chars; a full token is ~100. The paste was truncated at a line break — copy the token and set the secret from the clipboard rather than typing it into a prompt."
            exit 1
          fi

          echo "$NAME is well-formed (${#CLEAN} chars)."

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install edge-tts
        run: pip install --quiet edge-tts

      - name: Install Claude Code
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Fetch feeds
        run: python fetch_news.py --hours 30

      - name: Curate and write the script
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          set -euo pipefail
          # Strip whitespace a terminal paste may have introduced; an embedded
          # CR or newline is rejected outright as an HTTP header value.
          CLAUDE_CODE_OAUTH_TOKEN=$(printf '%s' "${CLAUDE_CODE_OAUTH_TOKEN:-}" | tr -d '[:space:]')
          ANTHROPIC_API_KEY=$(printf '%s' "${ANTHROPIC_API_KEY:-}" | tr -d '[:space:]')

          # Sending both credentials at once is rejected — keep exactly one.
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            unset ANTHROPIC_API_KEY
            echo "Authenticating with the subscription OAuth token."
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            unset CLAUDE_CODE_OAUTH_TOKEN
            echo "Authenticating with an Anthropic API key."
          else
            echo "::error::Set either CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repo secret."
            exit 1
          fi

          MODEL_ARG=()
          [ -n "${CLAUDE_MODEL:-}" ] && MODEL_ARG=(--model "$CLAUDE_MODEL")

          claude -p "Produce today's episode of the daily news podcast.

          Read brief.md in this directory and follow it exactly. digest.md has
          already been generated for you and holds today's articles. Use
          fetch_article.py to read the top stories in full before writing.

          Write script.md and shownotes.md. Do not ask for confirmation; work to
          completion autonomously." \
            --permission-mode acceptEdits \
            --allowedTools 'Read' 'Write' 'Edit' 'Bash' 'Glob' 'Grep' \
            --add-dir "$PWD" \
            "${MODEL_ARG[@]}"

      - name: Sanity-check the script
        run: |
          set -euo pipefail
          test -s script.md   || { echo "::error::script.md missing or empty"; exit 1; }
          test -s shownotes.md || { echo "::error::shownotes.md missing or empty"; exit 1; }
          WORDS=$(wc -w < script.md)
          echo "script is $WORDS words"
          if [ "$WORDS" -lt 900 ]; then
            echo "::error::script is only $WORDS words — curation likely failed"; exit 1
          fi
          [ "$WORDS" -gt 2600 ] && echo "::warning::script is unusually long ($WORDS words)"
          exit 0

      - name: Render audio
        run: python make_episode.py script.md -o episode.mp3 --meta-out episode.meta.json

      - name: Verify audio
        run: |
          set -euo pipefail
          BYTES=$(stat -c%s episode.mp3)
          echo "episode.mp3 is $BYTES bytes"
          [ "$BYTES" -ge 512000 ] || { echo "::error::render produced only $BYTES bytes"; exit 1; }

      - name: Publish release
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ needs.gate.outputs.date }}
          PRETTY: ${{ needs.gate.outputs.pretty }}
        run: |
          set -euo pipefail
          SECS=$(python -c "import json;print(json.load(open('episode.meta.json'))['seconds'])")
          cp episode.mp3 "daily-wrap-${DATE}.mp3"
          { cat shownotes.md; printf '\n\n<!-- duration_seconds: %s -->\n' "$SECS"; } > release-notes.md
          # Re-running the same day replaces that day's episode rather than failing.
          gh release delete "ep-${DATE}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "ep-${DATE}" \
            --title "Daily Wrap — ${PRETTY}" \
            --notes-file release-notes.md \
            "daily-wrap-${DATE}.mp3"

      - name: Keep the working files for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ needs.gate.outputs.date }}
          path: |
            digest.md
            script.md
            shownotes.md
            episode.meta.json
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: [gate, build]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build the feed from published releases
        env:
          GH_TOKEN: ${{ github.token }}
          PODCAST_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          PODCAST_IMAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/cover.png
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            | jq -s 'add // []' > releases.json
          python make_feed.py --config podcast.json --out site < releases.json
          cp cover.png site/cover.png
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
